<svg class="pueblo" viewBox="0 0 360 240" role="img" aria-labelledby="pueblo-t">
<title id="pueblo-t">El pueblo de Enletrados: cada lugar se ilumina al devolverle sus palabras</title>
<defs>
  <linearGradient id="g-cielo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--cielo-a)"/><stop offset="1" style="stop-color:var(--cielo-b)"/>
  </linearGradient>
  <linearGradient id="g-mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB4BF"/><stop offset="1" stop-color="#5E8E9E"/></linearGradient>
  <radialGradient id="g-luz"><stop offset="0" stop-color="#FFE3A3" stop-opacity=".9"/><stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/></radialGradient>
  <filter id="apagado" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values=".28"/>
    <feComponentTransfer><feFuncR type="linear" slope=".86" intercept=".12"/><feFuncG type="linear" slope=".86" intercept=".11"/><feFuncB type="linear" slope=".86" intercept=".09"/></feComponentTransfer>
  </filter>
</defs>
<rect width="360" height="240" fill="url(#g-cielo)"/>
<circle class="sol" cx="70" cy="50" r="17" fill="#F2C27B" opacity=".85"/>
<g class="nube n1" fill="#fff" opacity=".7"><path d="M120 40h34a9 9 0 0 0-9-11 12 12 0 0 0-22 3 7 7 0 0 0-3 8z"/></g>
<g class="nube n2" fill="#fff" opacity=".55"><path d="M196 26h26a7 7 0 0 0-7-8 9 9 0 0 0-17 2 5 5 0 0 0-2 6z"/></g>

