<!doctype html>
<html lang="es" data-anuncios="{{anuncios}}"{{anunciosJs}}{{htmlExtra}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{titulo}}</title>
<meta name="description" content="{{descripcion}}">
<meta name="robots" content="{{robots}}">
{{canonica}}
{{social}}
<meta name="theme-color" content="#F7F0E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1712" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
{{precarga}}
<link rel="stylesheet" href="/{{css}}">
{{estiloExtra}}
<script>try{var t=JSON.parse(localStorage.getItem("enl_tema")),e=parseFloat(JSON.parse(localStorage.getItem("enl_letra"))),r=document.documentElement,s=JSON.parse(localStorage.getItem("enl_estilo"));if(t==="claro"||t==="oscuro")r.dataset.tema=t;if(/^(mar|bosque|atardecer|noche|oro)$/.test(s))r.dataset.estilo=s;if(JSON.parse(localStorage.getItem("enl_fondomov"))===false)r.dataset.fondoQuieto="1";if(e>=1&&e<=1.3)r.style.setProperty("--escala",e)}catch(x){}</script>
</head>
<body data-pagina="{{pagina}}" class="{{clase}}">
{{iconos}}
{{contenido}}
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<script src="/{{js}}" defer></script>
</body>
</html>
