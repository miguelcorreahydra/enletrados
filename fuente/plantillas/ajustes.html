<header class="cabecera">
  <a class="marca" href="/"><svg viewBox="0 0 64 40" aria-hidden="true"><use href="#tilde"/></svg><b>En<span>letrados</span></b></a>
  <a class="redondo" href="/" aria-label="Volver al pueblo"><svg class="i"><use href="#i-casa"/></svg></a>
</header>
<main class="texto">
  <h1>Ajustes</h1>
  <div class="ajustes">
    <label class="ajuste"><span><b>Sonido</b><small>Las notas al formar palabras</small></span><input type="checkbox" class="interruptor" id="a-sonido"></label>
    <label class="ajuste"><span><b>Vibración</b><small>En los celulares que la tienen</small></span><input type="checkbox" class="interruptor" id="a-vibracion"></label>
    <div class="ajuste columna"><span><b>Tema</b><small>«Noche» es el pueblo de noche</small></span>
      <div class="segmentos" id="a-tema" role="radiogroup" aria-label="Tema">
        <button data-v="auto" role="radio">Automático</button><button data-v="claro" role="radio">Día</button><button data-v="oscuro" role="radio">Noche</button>
      </div></div>
    <div class="ajuste columna"><span><b>Tamaño de letra</b><small>De las pistas y los textos</small></span>
      <div class="segmentos" id="a-letra" role="radiogroup" aria-label="Tamaño de letra">
        <button data-v="1" role="radio">Normal</button><button data-v="1.12" role="radio">Grande</button><button data-v="1.25" role="radio">Muy grande</button>
      </div></div>
  </div>
  <h2 class="seccion-t">Tu progreso</h2>
  <p>Se guarda solo en este navegador: no hay cuentas ni contraseñas. Si borras los datos del navegador, también se borra.</p>
  <button class="boton peligro" id="a-borrar">Borrar progreso</button>
</main>
