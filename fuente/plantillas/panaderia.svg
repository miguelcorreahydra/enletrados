  <g fill="#E58B6B"><circle cx="73" cy="116" r="2"/><circle cx="81" cy="115" r="2"/><circle cx="105" cy="115" r="2"/></g>
  <g fill="#F0C75E"><circle cx="77" cy="114" r="1.8"/><circle cx="109" cy="114" r="1.8"/></g>
</g>
